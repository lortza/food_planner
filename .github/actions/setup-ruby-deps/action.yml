name: 'Setup Ruby with Dependencies'
description: 'Sets up Ruby environment with system dependencies for Rails app'

inputs:
  install-system-packages:
    description: 'Whether to install system packages (libvips, chrome, etc.)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Install system packages
      if: inputs.install-system-packages == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install --no-install-recommends -y google-chrome-stable curl libjemalloc2 libvips sqlite3

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: .ruby-version
        bundler-cache: true
        cache-version: 1

    - name: Unfreeze Bundler for Dependabot
      if: github.actor == 'dependabot[bot]'
      shell: bash
      run: bundle config set frozen false
